<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beast Library</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div id="player-controls">

    <div class="player-control">
        <label for="wisdom-modifier">
            Wisdom Modifier
        </label>

        <input
            type="number"
            id="wisdom-modifier"
            value="4"
            step="1"
        >
    </div>


    <div class="player-control">
        <label for="proficiency-bonus">
            Proficiency Bonus
        </label>

        <input
            type="number"
            id="proficiency-bonus"
            value="3"
            step="1"
        >
    </div>


    <div class="player-control">
        <label for="spell-attack-modifier">
            Spell Attack Modifier
        </label>

        <input
            type="number"
            id="spell-attack-modifier"
            value="7"
            step="1"
        >
    </div>


    <div class="player-control">
        <label for="spell-save-dc">
            Spell Save DC
        </label>

        <input
            type="number"
            id="spell-save-dc"
            value="15"
            step="1"
        >
    </div>


    <div class="player-control">
        <label for="ranger-level">
            Ranger Level
        </label>

        <input
            type="number"
            id="ranger-level"
            value="5"
            min="1"
            step="1"
        >
    </div>

</div>


        <h1>Beast Library</h1>

    </header>


    <main id="creature-library">
        <!-- JavaScript will put our categories here -->
    </main>


    <script src="script.js"></script>

</body>

</html>
